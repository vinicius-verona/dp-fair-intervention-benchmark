[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BenchmarkDPFair"
version = "0.2.5"
description = "A differentially private data synthesizer and fairness intervention benchmark framework"
authors = [
  { name="Vinicius Gabriel Angelozzi Verona de Resende", email="verona.projects@tutanota.com" },
  { name="HÃ©ber Hwang Arcolezi", email="heber.hwang-arcolezi@etsmtl.ca" }
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "aif360>=0.6.1",
  "aif360[inFairness]>=0.6.1",
  "fairlearn>=0.12.0",
  "inFairness>=0.2.3",
  "matplotlib>=3.9.4",
  "matplotlib-inline>=0.1.7",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "scikit-learn>=1.6.1",
  "scipy>=1.13.1",
  "smartnoise-sql>=1.0.6",
  "smartnoise-synth>=1.0.5",
  "tabulate>=0.9.0",
  "ucimlrepo>=0.0.7",
  "xgboost>=3.2.0; sys_platform == 'darwin'",
  "xgboost-cpu>=3.2.0; sys_platform == 'linux'",
  "xgboost-cpu>=3.2.0; sys_platform == 'win32'",
  "cvxpy>=1.6.5",
  "chex>=0.1.87",
  "BlackBoxAuditing==0.1.54"
]
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/vinicius-verona/dp-fair-intervention-benchmark"
Issues = "https://github.com/vinicius-verona/dp-fair-intervention-benchmark/issues"